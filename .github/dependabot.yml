# Dependabot — keeps platform-hello's pins fresh.
#
# WHY docker matters most here: the runtime base is digest-pinned
# (gcr.io/distroless/nodejs22-debian12:nonroot@sha256:...) for
# reproducible builds. A pin never moves on its own, so patched base
# rebuilds (e.g. OpenSSL fixes) only arrive through a digest-bump PR.
# Pinning without this file trades supply-chain risk for staleness.
#
# No github-actions entry: the only `uses:` is our own reusable
# workflow at @main (same owner, no trust boundary); Dependabot does
# not bump branch refs anyway.

version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore"
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
    ignore:
      # @types/node must track the RUNTIME Node major (22, distroless
      # nodejs22 base). Newer type majors describe APIs that don't
      # exist at runtime. Bump together with the base image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors (7 = the native compiler rewrite) are a
      # planned golden-path upgrade done in the template first, not
      # a weekly bot bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # OpenTelemetry JS ships as a lockstep set whose version numbers
      # cross semver boundaries together (sdk-node 0.223 → 0.301 pairs
      # with resources/core 2.x → 3.x and a narrow api peer range). The
      # minor-and-patch group split that set and npm failed ERESOLVE.
      # This group comes first (first match wins) and takes ALL update
      # types, so the whole set moves in one PR.
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
