---
# objectbucket.yaml — platform-hello
#
# A request for one bucket (platform ADR-0027). The platform decides how
# to fulfil it:
#   on kind: a MinIO bucket plus a user and key limited to that bucket.
#   on EKS:  an S3 bucket (private, encrypted, versioned) plus an IAM
#            role limited to that bucket, which only this service's
#            ServiceAccount can assume (platform ADR-0034).
# Same YAML on both.
#
# `writeConnectionSecretToRef` names the Secret the platform fills in;
# deployment.yaml loads it with envFrom. Keys: BUCKET_NAME and AWS_REGION
# always; an access key and endpoint on kind; AWS_ROLE_ARN on EKS.

apiVersion: platform.idp.io/v1alpha1
kind: ObjectBucket
metadata:
  name: platform-hello
  labels:
    app: platform-hello
    app.kubernetes.io/name: platform-hello
spec:
  parameters:
    region: us-east-1       # MinIO ignores this; must be a valid XRD enum value
    publicRead: false       # SILENTLY IGNORED on kind (vshn provider limitation,
                            # Gap-A decision — Phase 4 Wave 2 strategic intro)
    versioning: true        # SILENTLY IGNORED on kind (same reason)
                            # Both take effect on EKS where the s3 variant runs
  writeConnectionSecretToRef:
    name: platform-hello-bucket-conn
