---
# externalsecret.yaml — platform-hello
#
# Pulls app config from Vault at `secret/platform-team/platform-hello` into a
# k8s Secret. The Deployment's envFrom mounts this Secret's keys as env vars
# on the container.
#
# Vault path is convention: `secret/<team>/<service>`. Owner of the Vault
# path controls what keys land in the pod. Common keys:
#   DATABASE_URL, REDIS_URL, API_KEY_STRIPE, etc.
#
# CRD-defaults declared explicitly per runbook FM6 — otherwise ArgoCD
# reports OutOfSync forever because the ExternalSecret CRD auto-injects
# conversionStrategy/decodingStrategy/metadataPolicy/deletionPolicy on apply.
#
# BEFORE THIS APPLIES: seed Vault at least once:
#   kubectl -n vault exec -it vault-0 -- env VAULT_TOKEN="$ROOT_TOKEN" \
#     vault kv put -mount=secret platform-team/platform-hello \
#       DUMMY_CONFIG=starter-value
# If Vault has nothing at this path, the pod crash-loops with envFrom
# error until seeded. ArgoCD's retry catches up once Vault has content.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-hello-config
  labels:
    app: platform-hello
    app.kubernetes.io/name: platform-hello
spec:
  refreshInterval: 5m

  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore

  target:
    name: platform-hello-config
    creationPolicy: Owner
    deletionPolicy: Retain

  # dataFrom: sync ALL keys from the Vault path into the Secret. Alternative
  # is per-key `data:` mapping — dataFrom is simpler when the app owner
  # controls what's in Vault.
  dataFrom:
    - extract:
        key: platform-team/platform-hello
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
