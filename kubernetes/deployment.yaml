---
# deployment.yaml — platform-hello
#
# 2 replicas (HA even at MVP). Distroless nonroot image built from the
# skeleton's Dockerfile. Environment: inline vars below, plus envFrom
#   - platform-hello-bucket-conn — S3 credentials from ObjectBucket XRC's
#                                    writeConnectionSecretToRef
# No Vault/ExternalSecret config: this service reads no secret config
# (the Vault path only ever held the template's DUMMY_CONFIG placeholder,
# and depending on it took the service down when Vault was reset).
#
# Probes:
#   /healthz — liveness. Kubelet restarts pod if fails.
#   /readyz  — readiness. Kubelet removes pod from Service endpoints if fails.
# Probes deliberately don't touch external dependencies — a bad DB shouldn't
# cause a crash loop, it should just fail readiness.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-hello
  labels:
    app: platform-hello
    app.kubernetes.io/name: platform-hello
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: platform-hello
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: platform-hello
  # 25% surge / 25% max unavailable → 2-replica deployment drops to 2 during
  # rolling update (adds 1, drains 1) — no downtime.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: platform-hello
        app.kubernetes.io/name: platform-hello
        app.kubernetes.io/component: api
      annotations:
        # Rolling restart on Secret change — kubectl rollout restart deploy
        # platform-hello works, but this annotation makes ArgoCD track it.
        checksum/config: "REPLACE_ON_ROTATE"
    spec:
      # distroless image runs as UID 65532 (nonroot). Enforce at pod level.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-hello
          # Image built + pushed by the service's own CI (Phase 7 wires
          # GitHub Actions → GHCR). v0.1.0 is pinned per-release; NOT
          # a floating tag like `latest` (CLAUDE.md §9).
          image: ghcr.io/kelechi-nwankpa/platform-hello:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # ─────────────────────────────────────────────────────────
          # Environment — sourced from Secrets + a few inline OTel vars
          # ─────────────────────────────────────────────────────────
          envFrom:
            # S3 credentials + BUCKET_NAME from the ObjectBucket XRC
            # (see objectbucket.yaml). Keys populated by Crossplane:
            #   on kind (MinIO): BUCKET_NAME, AWS_REGION, AWS_ACCESS_KEY_ID,
            #                    AWS_SECRET_ACCESS_KEY, AWS_ENDPOINT_URL
            #   on EKS (S3):     BUCKET_NAME, AWS_REGION, AWS_ROLE_ARN
            # The app never reads the credential variables itself; the
            # AWS SDK picks whichever set is present (platform ADR-0034).
            - secretRef:
                name: platform-hello-bucket-conn
          env:
            # Where the AWS SDK finds this pod's identity token (mounted
            # below). Used only when there is no access key, i.e. on EKS:
            # the SDK trades the token plus AWS_ROLE_ARN for one-hour
            # credentials. On kind the MinIO key is present and wins, so
            # this is inert there. Kept here, next to the mount it points
            # at, so the path cannot drift from the volume.
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/idp/aws/token
            # OTel exporter → Wave 2 OTel Collector in observability ns.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: platform-hello
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=platform-team,deployment.environment=kind"
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: aws-token
              mountPath: /var/run/secrets/idp/aws
              readOnly: true
          # ─────────────────────────────────────────────────────────
          # Probes
          # ─────────────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # Startup probe = generous window for cold start (TS compile output
          # + OTel SDK init + first Fastify listener bind ≈ 2-3s).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          # ─────────────────────────────────────────────────────────
          # Resources — modest for a Fastify hello service on kind
          # ─────────────────────────────────────────────────────────
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Distroless has no shell — no sh -c debugging. Debug via
          # `kubectl debug -it <pod> --image=alpine --target=platform-hello`
          # (ephemeral debug container, Phase 8 documents pattern).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        # A ServiceAccount token meant for AWS only. `audience` is what
        # the IAM role's trust policy checks; the default API-server
        # token has a different audience and AWS would refuse it. The
        # kubelet replaces it before it expires (1 hour).
        # WHY mounted explicitly and not injected by the EKS webhook
        # (the usual `eks.amazonaws.com/role-arn` annotation): the same
        # pod spec then works on kind and EKS, and no AWS account id
        # lives in this repo.
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
      terminationGracePeriodSeconds: 30
      # ServiceAccount pinned so RBAC (Phase 8 hardening) can grant
      # namespace-scoped permissions.
      serviceAccountName: platform-hello
